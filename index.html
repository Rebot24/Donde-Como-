<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurantes top</title>
<meta name="description" content="Encuentra los restaurantes mejor valorados y cercanos.">
<meta name="theme-color" content="#0A7A4D">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Restaurantes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/Icon-192.png">
<link rel="apple-touch-icon" href="icons/Icon-192.png">
<style>
:root{--g:#0A7A4D;--gd:#075C3A;--bg:#F3F6F4;--ink:#13221B;--muted:#5C6B63;--line:#DCE4DF;--star:#F2B01E;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,input{font:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:2px}

header{background:var(--g);color:#fff;padding:calc(var(--sat) + 12px) 16px 10px}
h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.sub{margin:2px 0 10px;font-size:.88rem;opacity:.9}
.bar{display:flex;gap:8px}
.bar select,.bar button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.bar select option{color:#000}
.bar button{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-size:.86rem}
.chip[aria-pressed=true]{background:#fff;color:var(--gd);font-weight:700}

#status{padding:8px 16px;font-size:.86rem;color:var(--muted)}
main{flex:1;min-height:0;position:relative}
#list{height:100%;overflow-y:auto;padding:0 12px 16px;margin:0;list-style:none}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:32px 1fr auto;gap:4px 10px;align-items:start}
.n{width:28px;height:28px;border-radius:50%;background:var(--bg);color:var(--gd);font-weight:800;display:grid;place-items:center;font-size:.85rem}
.card:first-child .n{background:var(--star);color:#3a2a00}
.nm{font-weight:700;font-size:1.02rem;line-height:1.25}
.rt{background:var(--g);color:#fff;border-radius:10px;padding:4px 9px;font-weight:800;white-space:nowrap}
.mt{grid-column:2/4;color:var(--muted);font-size:.86rem}
.go{grid-column:2/4;justify-self:start;color:var(--g);font-weight:700;text-decoration:none;font-size:.9rem;padding-top:2px}
.manual{display:flex;gap:8px;padding:6px 4px 12px}
.manual input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.manual button{border:0;background:var(--g);color:#fff;border-radius:10px;padding:0 16px;font-weight:700}
#map{position:absolute;inset:0;visibility:hidden}
body.map #map{visibility:visible}
body.map #list{visibility:hidden}
.me{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}

nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav button{flex:1;border:0;background:none;padding:12px 0;font-weight:700;color:var(--muted)}
nav button[aria-current=true]{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}

#splash{position:fixed;inset:0;background:var(--g);color:#fff;display:grid;place-content:center;justify-items:center;gap:16px;z-index:10;transition:opacity .3s}
#splash img{width:96px;height:96px;border-radius:22px}
#splash.off{opacity:0;pointer-events:none}
#install{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 64px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:none;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:5}
#install img{width:44px;height:44px;border-radius:10px}
#install p{margin:0;font-size:.88rem;color:var(--muted)}
#install strong{color:var(--ink);display:block}
#install .x{margin-left:auto;border:0;background:none;font-size:1.4rem;color:var(--muted);padding:4px 8px}
#install .ok{border:0;background:var(--g);color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="splash"><img src="icons/Icon-192.png" alt=""><div>Buscando los mejores restaurantes…</div></div>

<header>
  <h1>Restaurantes top</h1>
  <p class="sub">Los mejor valorados cerca de ti.</p>
  <div class="bar">
    <select id="radius" aria-label="Radio de búsqueda">
      <option value="500">500 m</option><option value="1000" selected>1 km</option>
      <option value="2000">2 km</option><option value="5000">5 km</option>
    </select>
    <button id="locate" type="button">Usar mi ubicación</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Tipo de cocina"></div>
</header>
<div id="status" role="status" aria-live="polite"></div>
<main>
  <ul id="list"></ul>
  <div id="map" role="application" aria-label="Mapa de restaurantes"></div>
</main>
<nav>
  <button id="tabList" aria-current="true">Lista</button>
  <button id="tabMap">Mapa</button>
</nav>

<div id="install" role="dialog" aria-label="Instalar aplicación">
  <img src="icons/Icon-192.png" alt="">
  <p><strong>Instala Restaurantes</strong><span id="installTxt">Pulsa «Compartir» y luego «Añadir a pantalla de inicio».</span></p>
  <button class="ok" id="installOk" type="button">Instalar</button>
  <button class="x" id="installX" type="button" aria-label="Cerrar">×</button>
</div>

<script>
// ============ CONFIGURACIÓN ============
const API_KEY = 'TU_CLAVE_DE_GOOGLE_AQUI';   // restringida a tu dominio de GitHub Pages
const MIN_REVIEWS = 10;
// =======================================
const $ = s => document.querySelector(s);
const status = m => $('#status').textContent = m;
const hideSplash = () => $('#splash').classList.add('off');
setTimeout(hideSplash, 12000);

const INTERESTS = {
  'Española': ['spanish_restaurant'],
  'Italiana y pizza': ['italian_restaurant', 'pizza_restaurant'],
  'Japonesa y sushi': ['japanese_restaurant', 'sushi_restaurant', 'ramen_restaurant'],
  'Asiática': ['chinese_restaurant', 'thai_restaurant', 'vietnamese_restaurant', 'korean_restaurant', 'indian_restaurant'],
  'Mexicana': ['mexican_restaurant'],
  'Hamburguesas': ['hamburger_restaurant'],
  'Marisco': ['seafood_restaurant'],
  'Mediterránea': ['mediterranean_restaurant'],
  'Carnes': ['steak_house', 'barbecue_restaurant'],
  'Vegetariano / vegano': ['vegetarian_restaurant', 'vegan_restaurant']
};
const selected = new Set();
let map, Place, Rank, Marker, Pin, info, pos, meMarker, markers = [], seq = 0, bounds;

for (const name of Object.keys(INTERESTS)) {
  const b = Object.assign(document.createElement('button'), { className: 'chip', type: 'button', textContent: name });
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => {
    selected.has(name) ? selected.delete(name) : selected.add(name);
    b.setAttribute('aria-pressed', selected.has(name));
    if (pos) load();
  };
  $('#chips').appendChild(b);
}

// Pestañas Lista / Mapa
function tab(m) {
  document.body.classList.toggle('map', m);
  $('#tabList').setAttribute('aria-current', !m);
  $('#tabMap').setAttribute('aria-current', m);
  if (m && map) { google.maps.event.trigger(map, 'resize'); bounds && map.fitBounds(bounds, 50); }
}
$('#tabList').onclick = () => tab(false);
$('#tabMap').onclick = () => tab(true);

// Google Maps
window.gm_authFailure = () => { hideSplash(); status('La clave de Google no es válida o no está autorizada para este dominio.'); };
window.initMap = async () => {
  map = new google.maps.Map($('#map'), { center: { lat: 40.2, lng: -3.7 }, zoom: 6, mapId: 'DEMO_MAP_ID',
    streetViewControl: false, mapTypeControl: false, clickableIcons: false });
  info = new google.maps.InfoWindow();
  ({ Place, SearchNearbyRankPreference: Rank } = await google.maps.importLibrary('places'));
  ({ AdvancedMarkerElement: Marker, PinElement: Pin } = await google.maps.importLibrary('marker'));
  locate();   // pide la ubicación nada más abrir
};
if (!API_KEY || API_KEY.startsWith('TU_CLAVE')) {
  hideSplash(); status('Falta la clave de Google: edita API_KEY en index.html.');
} else {
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(API_KEY)}&loading=async&callback=initMap&language=es&v=weekly`;
  s.async = true; s.onerror = () => { hideSplash(); status('No se pudo cargar Google Maps. Revisa tu conexión.'); };
  document.head.appendChild(s);
}

// Ubicación
function locate() {
  if (!navigator.geolocation) return needPlace('Tu navegador no permite geolocalización.');
  status('Permite el acceso a tu ubicación para ver restaurantes cerca…');
  navigator.geolocation.getCurrentPosition(
    p => setPos(p.coords.latitude, p.coords.longitude),
    e => needPlace(e.code === 1 ? 'Has denegado la ubicación.' : 'No se pudo obtener tu ubicación.'),
    { enableHighAccuracy: true, timeout: 15000 });
}
$('#locate').onclick = () => map ? locate() : status('Espera a que cargue el mapa.');
$('#radius').onchange = () => pos && load();

function needPlace(msg) {
  hideSplash(); status(msg + ' Escribe una ciudad o barrio:');
  const f = document.createElement('form'); f.className = 'manual';
  f.innerHTML = '<input type="search" placeholder="Ciudad o barrio" aria-label="Ciudad o barrio"><button>Buscar</button>';
  f.onsubmit = async e => {
    e.preventDefault();
    const q = f.querySelector('input').value.trim(); if (!q) return;
    status('Buscando el lugar…');
    try {
      const j = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q))).json();
      j.length ? setPos(+j[0].lat, +j[0].lon) : status('No encontramos ese lugar. Prueba con otro nombre.');
    } catch { status('Error al buscar el lugar. Inténtalo de nuevo.'); }
  };
  $('#list').replaceChildren(f);
}

function setPos(lat, lng) {
  pos = { lat, lng };
  if (meMarker) meMarker.map = null;
  meMarker = new Marker({ map, position: pos, content: Object.assign(document.createElement('div'), { className: 'me' }), title: 'Estás aquí' });
  load();
}

// Búsqueda y orden por estrellas
async function load() {
  const mine = ++seq;
  status('Buscando restaurantes…');
  const types = [...selected].flatMap(n => INTERESTS[n]);
  try {
    const { places } = await Place.searchNearby({
      fields: ['displayName', 'location', 'rating', 'userRatingCount', 'formattedAddress', 'googleMapsURI', 'primaryTypeDisplayName', 'priceLevel'],
      locationRestriction: { center: pos, radius: +$('#radius').value },
      includedPrimaryTypes: types.length ? types : ['restaurant'],
      maxResultCount: 20, rankPreference: Rank.POPULARITY, language: 'es'
    });
    if (mine === seq) render(places);
  } catch (err) {
    console.error(err); hideSplash();
    status('No se pudo consultar Google Places. Comprueba que «Places API (New)» está activada para tu clave.');
  }
}
function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const euros = l => ({ INEXPENSIVE: '€', MODERATE: '€€', EXPENSIVE: '€€€', VERY_EXPENSIVE: '€€€€' })[String(l || '').replace('PRICE_LEVEL_', '')] || '';
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

function render(places) {
  markers.forEach(m => m.map = null); markers = [];
  const list = $('#list'); list.replaceChildren();
  let items = places.filter(p => p.rating != null);
  const solid = items.filter(p => (p.userRatingCount || 0) >= MIN_REVIEWS);
  if (solid.length >= 3) items = solid;
  items.sort((a, b) => b.rating - a.rating || (b.userRatingCount || 0) - (a.userRatingCount || 0));
  hideSplash();
  if (!items.length) return status('No hay restaurantes valorados aquí. Amplía el radio o quita filtros.');
  status(`${items.length} restaurantes, de mayor a menor valoración.`);

  bounds = new google.maps.LatLngBounds(pos);
  items.forEach((p, i) => {
    const loc = { lat: p.location.lat(), lng: p.location.lng() };
    const d = dist(pos, loc), name = p.displayName || '';
    const dTxt = d < 1000 ? Math.round(d / 10) * 10 + ' m' : (d / 1000).toFixed(1).replace('.', ',') + ' km';
    const rate = p.rating.toFixed(1).replace('.', ',');
    const meta = [p.primaryTypeDisplayName, euros(p.priceLevel), dTxt].filter(Boolean).join(' · ');
    const li = el('li', { className: 'card' },
      el('div', { className: 'n', textContent: i + 1 }),
      el('div', { className: 'nm', textContent: name }),
      el('div', { className: 'rt', textContent: '★ ' + rate }),
      el('div', { className: 'mt', textContent: `${meta} · ${(p.userRatingCount || 0).toLocaleString('es-ES')} reseñas` }),
      el('a', { className: 'go', href: p.googleMapsURI, target: '_blank', rel: 'noopener', textContent: 'Cómo llegar' }));
    const pin = new Pin({ glyph: String(i + 1), background: '#0A7A4D', borderColor: '#fff', glyphColor: '#fff' });
    const m = new Marker({ map, position: loc, content: pin.element, title: name });
    m.addListener('click', () => {
      info.setContent(el('div', {}, el('strong', { textContent: name }), el('br'), `★ ${rate} · ${meta}`));
      info.open({ map, anchor: m });
    });
    markers.push(m); bounds.extend(loc);
    list.appendChild(li);
  });
  map.fitBounds(bounds, 50);
}

// Instalación (PWA)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let dismissed = false; try { dismissed = localStorage.getItem('installDismissed') === '1'; } catch {}
let deferred;
const showInstall = () => { if (!standalone && !dismissed) $('#install').style.display = 'flex'; };
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  $('#installTxt').textContent = 'Úsala como una app, a pantalla completa.';
  $('#installOk').style.display = 'block'; showInstall();
});
if (/iphone|ipad|ipod/i.test(navigator.userAgent)) setTimeout(showInstall, 3000);
$('#installOk').onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; $('#install').style.display = 'none'; } };
$('#installX').onclick = () => { $('#install').style.display = 'none'; try { localStorage.setItem('installDismissed', '1'); } catch {} };
</script>
</body>
</html>
